<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRECER - Recursos</title>
    
    <!-- Iconos y Manifest PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Hojas de Estilos -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/recursos.css">
</head>
<body class="dashboard-body">

<body class="welcome-page">

    <header class="app-header">
    <div class="header-container">
        <div class="logo">
            <a href="inicio.html">CRECER</a>
        </div>
        <nav class="nav-menu" id="navMenu" aria-label="Navegación principal">
            <a href="inicio.html" class="nav-link">Inicio</a>
            
            <!-- Menú Desplegable de Módulos Unificado -->
            <div class="dropdown">
                <button class="dropdown-btn" id="dropdownBtn" aria-haspopup="true" aria-expanded="false">
                    Módulos ▼
                </button>
                <div class="dropdown-content" id="dropdownContent">
                    <a href="notas.html">Calificaciones</a>
                    <a href="perfil.html">Mi Perfil</a>
                    <a href="#" id="logoutBtn" class="dropdown-logout">Cerrar Sesión</a>
                </div>
            </div>

            <!-- Botón de Modo Claro / Oscuro Estándar -->
            <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">🌙 Tema</button>
        </nav>
    </div>
</header>

    <!-- Contenedor Principal (Compatible con Sticky Footer) -->
    <main class="app-main-container">
        <div class="main-container">
            
            <h2>Apuntes y Enlaces Académicos</h2>

            <section class="form-section">
                <form id="resourceForm" novalidate>
                    <div class="form-group">
                        <label for="resSubject">Materia *</label>
                        <input type="text" id="resSubject" placeholder="Ej. Programación Web" required>
                    </div>

                    <div class="form-group">
                        <label for="resTitle">Título del Recurso *</label>
                        <input type="text" id="resTitle" placeholder="Ej. Documentación JS ES6" required>
                    </div>

                    <div class="form-group">
                        <label for="resUrl">Enlace / URL *</label>
                        <input type="url" id="resUrl" placeholder="https://..." required>
                    </div>

                    <button type="submit" class="btn-submit">Guardar Recurso</button>
                </form>
            </section>

            <section class="list-section">
                <h3>Recursos Registrados</h3>
                <div id="loadingResources" class="loading-text">Cargando enlaces...</div>
                <div id="resourceGrid" class="resource-grid"></div>
            </section>

        </div>
    </main>

    <!-- Pie de Página Institucional (Sticky Footer) -->
<footer class="footer">
    <div class="footer-content">
        <p>&copy; 2026 <strong>CRECER</strong>. Todos los derechos reservados.</p>
        <div class="footer-links">
            <a href="privacidad.html">Privacidad</a>
            <a href="terminos.html">Términos</a>
            <a href="soporte.html">Soporte</a>
        </div>
    </div>
</footer>

    <script type="module" src="js/global.js"></script>
    <script type="module" src="js/recursos.js"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
