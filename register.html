<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRECER - Registrarse</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/register.css">
</head>
<body class="auth-body">

  <main class="auth-main-container">
    <div class="login-container">
      <section class="login-card">
        <header class="brand-header">
          <h1>CRECER</h1>
          <p>Plataforma de Gestión Académica</p>
        </header>

        <div class="auth-title-section">
          <h2>Crear Cuenta</h2>
          <p>Regístrate para comenzar a organizar tus tareas</p>
        </div>

        <form id="registerForm" class="auth-form" novalidate>
          <div class="form-group" id="groupAge">
            <label for="registerAge">Edad</label>
            <input type="number" id="registerAge" placeholder="Ej. 19" min="10" max="100" required>
          </div>

          <div class="form-group">
            <label for="registerEmail">Correo Electrónico</label>
            <input type="email" id="registerEmail" placeholder="estudiante@ejemplo.com" required>
          </div>

          <div class="form-group">
            <label for="registerPassword">Contraseña</label>
            <input type="password" id="registerPassword" placeholder="••••••••" required minlength="6">
          </div>

          <button type="submit" id="btnSubmitRegister" class="btn-auth">Crear Cuenta</button>
        </form>

        <div class="divider">
          <span>O</span>
        </div>

        <button id="btnGoogleAuth" class="btn-google" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Registrarse con Google
        </button>

        <p class="auth-redirect-text">
          ¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a>
        </p>
      </section>
    </div>
  </main>

  <script type="module" src="js/register.js"></script>
</body>
</html>
