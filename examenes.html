<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRECER - Exámenes</title>
  <link rel="stylesheet" href="css/examenes.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <h1>CRECER</h1>
      <span class="acronym-badge">Calendario de Exámenes</span>
    </div>
    <nav class="nav">
      <a href="index.html">Inicio</a>
      <a href="tareas.html">Tareas</a>
      <a href="examenes.html" class="active">Exámenes</a>
    </nav>
  </header>

  <main class="main-container">
    <h2>Programación de Exámenes</h2>

    <section class="form-section">
      <form id="examForm">
        <div class="form-group">
          <label for="examSubject">Asignatura</label>
          <input type="text" id="examSubject" placeholder="Ej. Álgebra" required>
        </div>
        <div class="form-group">
          <label for="examTopics">Temario</label>
          <input type="text" id="examTopics" placeholder="Ej. Unidades 1 y 2" required>
        </div>
        <div class="form-group">
          <label for="examDate">Fecha de Examen</label>
          <input type="date" id="examDate" required>
        </div>
        <button type="submit" class="btn-submit">Agendar Examen</button>
      </form>
    </section>

    <section class="list-section">
      <h3>Exámenes Programados</h3>
      <div id="loadingExams" class="loading-text">Cargando evaluaciones...</div>
      <div id="examGrid" class="exam-grid"></div>
    </section>
  </main>

  <script type="module" src="js/examenes.js"></script>
</body>
</html>
