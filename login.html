<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Iniciar Sesión - CRECER</title>
    
    <!-- Script síncrono para prevenir parpadeos del tema -->
    <script>
        (function() {
            const temaGuardado = localStorage.getItem('theme') || 'light';
            if (temaGuardado === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        })();
    </script>

    <!-- Iconos y Manifest PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Hojas de Estilos -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="auth-body">

    <!-- Botón de Conmutación de Tema Flotante Superior -->
    <button id="themeToggle" class="theme-toggle-auth" type="button" aria-label="Cambiar tema">🌙</button>

    <main class="auth-main-container">
        <div class="login-container">
            <section class="login-card auth-card">
                
                <!-- Encabezado de la marca -->
                <header class="brand-header auth-header">
                    <h1 class="auth-logo">CRECER</h1>
                    <p class="auth-subtitle">Plataforma de Gestión Académica</p>
                </header>

                <!-- Sección de bienvenida -->
                <div class="auth-title-section auth-intro">
                    <h2>Bienvenido de Nuevo</h2>
                    <p>Ingresa tus credenciales para acceder a tu agenda y panel de control.</p>
                </div>

                <!-- Botón de inicio de sesión con Google -->
                <div class="google-auth-container">
                    <button type="button" id="btnGoogleLogin" class="btn-google">
                        <svg class="google-icon" width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z" fill="#4285F4"/>
                            <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
                            <path d="M3.964 10.71A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
                            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.958l3.007 2.332C4.672 5.164 6.656 3.58 9 3.58z" fill="#EA4335"/>
                        </svg>
                        <span>Continuar con Google</span>
                    </button>
                </div>

                <div class="auth-divider">
                    <span>o con tu correo</span>
                </div>

                <!-- Formulario de Inicio de Sesión -->
                <form id="loginForm" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="loginEmail">Correo Electrónico *</label>
                        <input type="email" id="loginEmail" placeholder="estudiante@ejemplo.com" required autocomplete="email">
                    </div>

                    <div class="form-group">
                        <div class="label-with-link" style="display: flex; justify-content: space-between; align-items: center;">
                            <label for="loginPassword" style="margin-bottom: 0;">Contraseña *</label>
                            <!-- Enlace directo para recuperar contraseña -->
                            <a href="recuperar.html" class="text-sm text-indigo-600 hover:underline forgot-password-link">¿Olvidaste tu contraseña?</a>
                        </div>
                        <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password" style="margin-top: 0.5rem;">
                    </div>

                    <button type="submit" id="btnLogin" class="btn-primary btn-auth">Iniciar Sesión</button>
                </form>

                <!-- Redirección a registro -->
                <div class="auth-redirect-text">
                    <p>¿No tienes una cuenta? <a href="registro.html">Regístrate aquí</a></p>
                </div>

            </section>
        </div>
    </main>

    <!-- Contenedor para Notificaciones Flotantes (Toast) -->
    <div id="toast-container"></div>

    <!-- Script Principal de Login -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
