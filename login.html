<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de Codificación y Adaptabilidad Móvil -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>CRECER - Iniciar Sesión</title>
    
    <!-- Iconos y Manifest PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Hojas de Estilos -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body class="auth-body">

    <main class="auth-main-container">
        <div class="login-container">
            <section class="login-card auth-card">
                
                <!-- Encabezado de la marca -->
                <header class="brand-header auth-header">
                    <h1 class="auth-logo">CRECER</h1>
                    <p class="auth-subtitle">Plataforma de Gestión Académica</p>
                </header>

                <!-- Sección de bienvenida -->
                <div class="auth-title-section auth-intro">
                    <h2>Iniciar Sesión</h2>
                    <p>Ingresa tus credenciales para acceder</p>
                </div>

                <!-- Formulario principal de correo y contraseña -->
                <form id="loginForm" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="loginEmail">Correo Electrónico</label>
                        <input type="email" id="loginEmail" placeholder="estudiante@ejemplo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Contraseña</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                        
                        <!-- Enlace de recuperación optimizado y alineado -->
                        <div class="form-actions-right" style="text-align: right; margin-top: 8px;">
                            <a href="#" id="linkOlvidoPassword" class="forgot-link" style="font-size: 0.85rem; color: #4f46e5; text-decoration: none;">¿Olvidaste tu contraseña?</a>
                        </div>
                    </div>

                    <button type="submit" id="btnSubmitLogin" class="btn-primary btn-auth">Ingresar</button>
                </form>

                <!-- Separador moderno -->
                <div class="auth-divider divider">
                    <span>O continúa con</span>
                </div>

                <!-- Botón de Google optimizado -->
                <button type="button" id="btnGoogleAuth" class="btn-google">
                    <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Continuar con Google
                </button>

                <!-- Enlace de registro inferior -->
                <div class="auth-footer auth-redirect-text" style="margin-top: 20px; text-align: center;">
                    <p>¿No tienes una cuenta? <a href="register.html">Regístrate aquí</a></p>
                </div>

            </section>
        </div>
    </main>

    <!-- Contenedor para notificaciones flotantes (Toast) -->
    <div id="toast-container"></div>

    <!-- Script principal de autenticación -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
