<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Recuperar Contraseña - CRECER</title>
    
    <!-- Script síncrono para prevenir parpadeos del tema -->
    <script>
        (function() {
            const temaGuardado = localStorage.getItem('theme') || 'light';
            if (temaGuardado === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        })();
    </script>

    <!-- Iconos y Manifest PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Hojas de Estilos -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/recuperar.css">
</head>
<body class="auth-body">

    <!-- Botón de Conmutación de Tema Flotante Superior -->
    <button id="themeToggle" class="theme-toggle-auth" type="button" aria-label="Cambiar tema">🌙</button>

    <main class="auth-main-container">
        <div class="login-container">
            <section class="login-card auth-card">
                
                <!-- Encabezado de la marca -->
                <header class="brand-header auth-header">
                    <h1 class="auth-logo">CRECER</h1>
                    <p class="auth-subtitle">Plataforma de Gestión Académica</p>
                </header>

                <!-- Sección de introducción -->
                <div class="auth-title-section auth-intro">
                    <h2>Recuperar Contraseña</h2>
                    <p>Ingresa tu correo electrónico registrado y te enviaremos las instrucciones desde nuestro servidor backend de Python.</p>
                </div>

                <!-- Formulario de recuperación con id="recuperarForm" -->
                <form id="recuperarForm" class="auth-form" novalidate>
                    <div class="form-group">
                        <label for="recoveryEmail">Correo Electrónico *</label>
                        <!-- Campo de correo con id="recoveryEmail" -->
                        <input type="email" id="recoveryEmail" placeholder="estudiante@ejemplo.com" required autocomplete="email">
                    </div>

                    <button type="submit" id="btnEnviarRecovery" class="btn-primary btn-auth">Enviar Instrucciones</button>
                </form>

                <!-- Enlace de retorno al login -->
                <div class="auth-redirect-text">
                    <p>¿Recordaste tu contraseña? <a href="login.html">Volver a Iniciar Sesión</a></p>
                </div>

            </section>
        </div>
    </main>

    <!-- Contenedor para Notificaciones Flotantes (Toast) -->
    <div id="toast-container"></div>

    <!-- Script Principal de Recuperación -->
    <script type="module" src="js/recuperar.js"></script>
</body>
</html>
