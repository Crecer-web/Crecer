<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notas y Promedios | CRECER</title>
    
    <!-- Iconos y Manifest PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Hojas de Estilos -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/notas.css">
</head>
<body class="dashboard-body">

<body class="welcome-page">

    <header class="app-header">
    <div class="header-container">
        <div class="logo">
            <a href="inicio.html">CRECER</a>
        </div>
        <nav class="nav-menu" id="navMenu" aria-label="Navegación principal">
            <a href="inicio.html" class="nav-link">Inicio</a>
            
            <!-- Menú Desplegable de Módulos Unificado -->
            <div class="dropdown">
                <button class="dropdown-btn" id="dropdownBtn" aria-haspopup="true" aria-expanded="false">
                    Módulos ▼
                </button>
                <div class="dropdown-content" id="dropdownContent">
                    <a href="recursos.html">Recursos</a>
                    <a href="perfil.html">Mi Perfil</a>
                    <a href="#" id="logoutBtn" class="dropdown-logout">Cerrar Sesión</a>
                </div>
            </div>

            <!-- Botón de Modo Claro / Oscuro Estándar -->
            <button id="themeToggle" class="theme-toggle" aria-label="Cambiar tema">🌙 Tema</button>
        </nav>
    </div>
</header>

    <!-- Contenedor Principal (Compatible con Sticky Footer) -->
    <main class="app-main-container">
        <div class="main-container">
            
            <!-- Resumen de Promedio General -->
            <section class="promedio-hero">
                <div class="promedio-card">
                    <h2>Promedio General</h2>
                    <div class="promedio-val" id="promedioGeneral">--</div>
                    <p id="promedioEstado">Registra tus calificaciones para calcular tu desempeño.</p>
                </div>
            </section>

            <div class="notas-layout">
                <!-- Formulario para agregar calificación -->
                <section class="form-card-notas">
                    <h3>Agregar Calificación</h3>
                    <form id="notaForm" novalidate>
                        <div class="form-group">
                            <label for="materiaNotaInput">Materia *</label>
                            <input type="text" id="materiaNotaInput" placeholder="Ej. Matemática, Lengua" required>
                        </div>

                        <div class="form-group">
                            <label for="evaluacionInput">Evaluación / Instancia *</label>
                            <input type="text" id="evaluacionInput" placeholder="Ej. Parcial 1, Trabajo Práctico" required>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="calificacionInput">Nota (1 - 10) *</label>
                                <input type="number" id="calificacionInput" step="0.1" min="1" max="10" placeholder="Ej. 8.5" required>
                            </div>
                            <div class="form-group">
                                <label for="fechaNotaInput">Fecha</label>
                                <input type="date" id="fechaNotaInput">
                            </div>
                        </div>

                        <button type="submit" id="btnGuardarNota" class="btn-primary">Registrar Nota</button>
                    </form>
                </section>

                <!-- Lista de Calificaciones Cargadas -->
                <section class="list-section-notas">
                    <h3>Historial de Notas</h3>
                    <div id="notasGrid" class="notas-grid">
                        <!-- Se renderiza dinámicamente -->
                    </div>
                </section>
            </div>

        </div>
    </main>

    <!-- Pie de Página Institucional (Sticky Footer) -->
<footer class="footer">
    <div class="footer-content">
        <p>&copy; 2026 <strong>CRECER</strong>. Todos los derechos reservados.</p>
        <div class="footer-links">
            <a href="privacidad.html">Privacidad</a>
            <a href="terminos.html">Términos</a>
            <a href="soporte.html">Soporte</a>
        </div>
    </div>
</footer>

    <script type="module" src="js/global.js"></script>
    <script type="module" src="js/notas.js"></script>
    <script type="module" src="js/login.js"></script>
</body>
</html>
