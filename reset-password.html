<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRECER - Nueva Contraseña</title>
    <!-- Tus estilos CSS globales -->
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/reset-password.css">
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full bg-white p-8 rounded-lg shadow-md border border-gray-200">
        <h2 class="text-2xl font-bold text-center text-indigo-600 mb-2">Plataforma CRECER</h2>
        <p class="text-sm text-center text-gray-600 mb-6">Ingresa tu nueva contraseña para actualizar el acceso.</p>

        <form id="resetPasswordForm">
            <div class="mb-4">
                <label for="newPassword" class="block text-sm font-medium text-gray-700 mb-1">Nueva Contraseña</label>
                <input type="password" id="newPassword" required 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="Mínimo 6 caracteres">
            </div>

            <div class="mb-6">
                <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" required 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    placeholder="Repite la nueva contraseña">
            </div>

            <button type="submit" id="btnActualizar" 
                class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition font-medium">
                Actualizar Contraseña
            </button>
        </form>
    </div>

    <!-- Script de lógica vinculado -->
    <script type="module" src="js/reset-password.js"></script>
</body>
</html>
