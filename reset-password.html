<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Plataforma CRECER</title>
    <!-- Estilos Embebidos y Enlazados para garantizar el diseño bajo cualquier entorno -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/reset-password.css">
    <style>
        /* Respaldos de estilo directo por si la ruta estática tarda en responder en Vercel */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body.reset-page-body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .reset-card-container { background: #ffffff; width: 100%; max-width: 440px; padding: 40px; border-radius: 16px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2); }
        .reset-card-header { text-align: center; margin-bottom: 28px; }
        .reset-title { color: #3182ce; font-size: 26px; font-weight: 700; margin-bottom: 8px; }
        .reset-subtitle { color: #4a5568; font-size: 14px; line-height: 1.5; }
        .reset-form { display: flex; flex-direction: column; gap: 18px; }
        .form-group { display: flex; flex-direction: column; gap: 6px; text-align: left; }
        .form-label { font-size: 14px; font-weight: 600; color: #2d3748; }
        .form-input { width: 100%; padding: 12px 16px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 15px; outline: none; transition: all 0.2s ease; }
        .form-input:focus { border-color: #3182ce; box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2); }
        .btn-submit { width: 100%; padding: 14px; background-color: #3182ce; color: #ffffff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s ease; margin-top: 10px; }
        .btn-submit:hover { background-color: #2b6cb0; }
        .btn-submit:disabled { background-color: #a0aec0; cursor: not-allowed; }
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
    </style>
</head>
<body class="reset-page-body">

    <div class="reset-card-container">
        <div class="reset-card-header">
            <h1 class="reset-title">Plataforma CRECER</h1>
            <p class="reset-subtitle">Ingresa tu nueva contraseña para actualizar el acceso a tu cuenta.</p>
        </div>

        <form id="resetPasswordForm" class="reset-form" novalidate>
            <div class="form-group">
                <label for="newPassword" class="form-label">Nueva Contraseña</label>
                <input 
                    type="password" 
                    id="newPassword" 
                    class="form-input" 
                    placeholder="Mínimo 6 caracteres" 
                    required 
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    class="form-input" 
                    placeholder="Repite la nueva contraseña" 
                    required 
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" id="btnActualizar" class="btn-submit">
                Actualizar Contraseña
            </button>
        </form>
    </div>

    <!-- Contenedor para notificaciones flotantes -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Carga del script modular -->
    <script type="module" src="js/reset-password.js"></script>
</body>
</html>
