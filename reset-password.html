<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Restablecer Contraseña - Plataforma CRECER</title>
    
    <!-- Enlace a hojas de estilo externas desvinculadas -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/reset-password.css">
</head>
<body class="reset-page-body">

    <div class="reset-card-container">
        <div class="reset-card-header">
            <h1 class="reset-title">Plataforma CRECER</h1>
            <p class="reset-subtitle">Ingresa tu nueva contraseña para actualizar el acceso a tu cuenta académica.</p>
        </div>

        <form id="resetPasswordForm" class="reset-form" novalidate>
            <div class="form-group">
                <label for="newPassword" class="form-label">Nueva Contraseña</label>
                <input 
                    type="password" 
                    id="newPassword" 
                    class="form-input" 
                    placeholder="Mínimo 6 caracteres" 
                    required 
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    class="form-input" 
                    placeholder="Repite la nueva contraseña" 
                    required 
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" id="btnActualizar" class="btn-submit">
                Actualizar Contraseña
            </button>
        </form>
    </div>

    <!-- Contenedor para notificaciones flotantes toast -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Carga de script modular de JavaScript separado -->
    <script type="module" src="js/reset-password.js"></script>
</body>
</html>
