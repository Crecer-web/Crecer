<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Restablecer Contraseña - Plataforma CRECER</title>
    
    <!-- Script síncrono unificado para prevenir parpadeos del tema -->
    <script>
        (function() {
            const temaGuardado = localStorage.getItem('theme') || 'light';
            if (temaGuardado === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        })();
    </script>

    <!-- Iconos y Manifest PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Hojas de Estilos -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/reset-password.css">
</head>
<body class="reset-page-body">

    <div class="reset-card-container">
        <div class="reset-card-header">
            <h1 class="reset-title">Plataforma CRECER</h1>
            <p class="reset-subtitle">Ingresa tu nueva contraseña para actualizar el acceso a tu cuenta académica.</p>
        </div>

        <form id="resetPasswordForm" class="reset-form" novalidate>
            <div class="form-group">
                <label for="newPassword" class="form-label">Nueva Contraseña</label>
                <input 
                    type="password" 
                    id="newPassword" 
                    class="form-input" 
                    placeholder="Mínimo 8 caracteres" 
                    required 
                    autocomplete="new-password"
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    class="form-input" 
                    placeholder="Repite la nueva contraseña" 
                    required 
                    autocomplete="new-password"
                >
            </div>

            <button type="submit" id="btnActualizar" class="btn-submit">
                Actualizar Contraseña
            </button>
        </form>
    </div>

    <!-- Contenedor para notificaciones flotantes toast -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Carga de script modular de JavaScript separado -->
    <script type="module" src="js/reset-password.js"></script>
</body>
</html>
