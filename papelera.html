<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Papelera de Reciclaje | CRECER</title>
    
    <!-- Iconos y Manifest PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/logo.png">
    <link rel="apple-touch-icon" href="img/logo.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    
    <!-- Hojas de Estilos -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/papelera.css">
</head>
<body class="dashboard-body">

    <!-- Encabezado de Navegación del Dashboard -->
    <header class="app-header">
        <div class="header-container">
            <!-- Logo -->
            <div class="logo">
                <a href="inicio.html">CRECER</a>
            </div>
            
            <!-- Contenedor Unificado Alineado Totalmente a la Derecha -->
            <div class="header-right-group">
                <!-- Navegación Principal -->
                <nav class="nav-menu" id="navMenu" aria-label="Navegación principal">
                    <a href="inicio.html" class="nav-link">Inicio</a>
                    
                    <!-- Menú Desplegable de Módulos Unificado -->
                    <div class="dropdown" id="modulesDropdown">
                        <button class="dropdown-btn" id="dropdownBtn" aria-haspopup="true" aria-expanded="false" type="button">
                            Módulos ▼
                        </button>
                        <div class="dropdown-content" id="dropdownContent">
                            <a href="notas.html">Calificaciones</a>
                            <a href="horario.html">Horario</a>
                            <a href="recursos.html">Recursos</a>
                            <a href="perfil.html">Mi Perfil</a>
                            <a href="#" id="logoutBtn" class="dropdown-logout">Cerrar Sesión</a>
                        </div>
                    </div>
                </nav>

                <!-- Botón de Conmutación de Tema (Siempre Fijo a la Derecha) -->
                <button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar tema">🌙</button>

                <!-- Botón Hamburguesa para Dispositivos Móviles -->
                <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú de navegación" type="button">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenedor Principal Adaptado para Estirar la Página -->
    <main class="app-main-container">
        <div class="main-container">
            
            <!-- Barra superior con Título y Botón de Retorno -->
            <div class="trash-top-bar">
                <div class="trash-header">
                    <h1>Papelera de Reciclaje</h1>
                    <p>Elementos eliminados temporalmente. Restáuralos a tu panel activo o elimínalos de forma permanente.</p>
                </div>
                <div class="trash-nav-action">
                    <a href="inicio.html" class="btn-secondary">← Volver al Panel</a>
                </div>
            </div>

            <!-- Sección de Contenido / Cuadrícula de Papelera -->
            <section class="trash-content-section">
                <div id="trashGrid" class="trash-grid">
                    <!-- Se cargan dinámicamente desde Firestore -->
                </div>
            </section>

        </div>
    </main>

<!-- Pie de Página Institucional Mínimo -->
<footer class="app-footer">
    <div class="footer-container">
        <p>&copy; 2026 <strong>CRECER</strong> &bull; Plataforma Educativa Integrada</p>
    </div>
</footer>

    <!-- Scripts de la aplicación -->
    <script type="module" src="js/global.js"></script>
    <script type="module" src="js/papelera.js"></script>
</body>
</html>
